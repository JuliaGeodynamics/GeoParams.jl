name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic_units_tests:
    name: GeoParamsDynamicUnits - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          include-matrix: false
      - name: Test GeoParamsDynamicUnits
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop(PackageSpec(path="lib/GeoParamsDynamicUnits")); Pkg.test("GeoParamsDynamicUnits")'

  units_tests:
    name: GeoParamsUnits - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          include-matrix: false
      - name: Test GeoParamsUnits
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop(PackageSpec(path="lib/GeoParamsUnits")); Pkg.test("GeoParamsUnits")'

  units_integration_tests:
    name: GeoParams unit extension - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          include-matrix: false
      - name: Test GeoParamsDynamicUnits extension
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path="lib/GeoParamsUnits"), PackageSpec(path="lib/GeoParamsDynamicUnits"), PackageSpec(path=pwd())]); include("test/DynamicUnitsExtension.jl")'

  run_tests:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 'lts'
          - os: macOS-latest
            arch: aarch64
            version: '1'
          - os: macOS-latest
            arch: aarch64
            version: 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
        with:
          include-matrix: false
      # Julia 1.10 ignores Project.toml's [sources], so the unregistered lib/
      # subpackages have to be developed explicitly. They go into a temporary
      # environment because developing them into the checkout would promote the
      # GeoParamsDynamicUnits weak dependency to a strong one.
      - name: Run tests
        if: matrix.version == 'lts'
        shell: bash
        run: julia --startup-file=no --color=yes -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path="lib/GeoParamsUnits"), PackageSpec(path="lib/GeoParamsDynamicUnits"), PackageSpec(path=pwd())]); Pkg.test("GeoParams")'
      - uses: julia-actions/julia-buildpkg@latest
        if: matrix.version != 'lts'
      - uses: julia-actions/julia-runtest@latest
        if: matrix.version != 'lts'
        with:
          coverage: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.arch == 'x64' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # or true if you want CI to fail when Codecov fails
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.10'
      - name: Install dependencies 1
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Install dependencies 2
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop([PackageSpec(path="lib/GeoParamsUnits"), PackageSpec(path="lib/GeoParamsDynamicUnits"), PackageSpec(path=pwd())]); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24'
             julia --project=docs/ docs/make.jl
